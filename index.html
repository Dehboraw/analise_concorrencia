<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Análise concorrência UEPG</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-theme {
            background-color: #121212;
            color: white;
        }

        body.dark-theme .card {
            background-color: #212529;
            color: white;
        }

        body.dark-theme .table {
            color: white;
        }

        body.dark-theme .table-striped > tbody > tr:nth-of-type(odd) > * {
            color: white;
        }

        body.dark-theme .modal-content {
            background-color: #212529;
            color: white;
        }

        .pagina {
            display: none;
        }

        .pagina.ativa {
            display: block;
        }

        #paginaComparacao {
            min-height: 70vh;
        }

        .comparar-inicial {
            min-height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-comparar-central {
            padding: 20px 50px;
            font-size: 1.4rem;
        }

        .analise-escura .accordion-item {
            background-color: #212529;
            border-color: #373b3e;
        }

        .analise-escura .accordion-button {
            background-color: #212529;
            color: white;
        }

        .analise-escura .accordion-button:not(.collapsed) {
            background-color: #2c3034;
            color: white;
            box-shadow: none;
        }

        .analise-escura .accordion-body {
            background-color: #212529;
            color: #dee2e6;
        }

        .analise-escura .accordion-button::after {
            filter: invert(1);
        }

    </style>

</head>

<body>


<!-- ============================================== -->
<!-- HEADER -->
<!-- ============================================== -->

<header
    class="p-3 text-bg-dark d-flex justify-content-between align-items-center"
>

    <span class="fs-4 text-white fw-bold">
        Análise concorrência UEPG
    </span>

    <div class="d-flex gap-2">

        <button
            id="btnPaginaCursos"
            class="btn btn-outline-light"
        >
            Cursos
        </button>

        <button
            id="btnPaginaComparar"
            class="btn btn-light"
        >
            Comparar
        </button>

        <button
            id="btnTema"
            class="btn btn-outline-warning"
        >
            🌙 Tema
        </button>

    </div>

</header>


<!-- ============================================== -->
<!-- PÁGINA DOS CURSOS -->
<!-- ============================================== -->

<div
    id="paginaCursos"
    class="pagina ativa"
>

    <div class="container py-4">


        <!-- DROPDOWN CURSO -->

        <div class="row justify-content-center mb-4">

            <div class="col-md-8">

                <label class="form-label fw-bold">
                    Selecione um curso
                </label>

                <select
                    id="selectCurso"
                    class="form-select form-select-lg"
                >
                    <option value="">
                        Selecione um curso
                    </option>
                </select>

            </div>

        </div>


        <!-- CONTEÚDO DO CURSO -->

        <div
            id="conteudoCurso"
            class="d-none"
        >


            <!-- TÍTULO -->

            <div class="text-center mb-4">

                <h2 id="tituloCurso"></h2>

            </div>


            <!-- ====================================== -->
            <!-- GRÁFICO -->
            <!-- ====================================== -->

            <div class="card shadow-sm mb-4">

                <div class="card-body">

                    <div class="row mb-3">

                        <div class="col-md-5">

                            <label class="form-label fw-bold">
                                Tipo de cota do gráfico
                            </label>

                            <select
                                id="selectCotaGrafico"
                                class="form-select"
                            >
                            </select>

                        </div>

                    </div>


                    <canvas
                        id="graficoCurso"
                    ></canvas>

                </div>

            </div>


            <!-- ====================================== -->
            <!-- TABELA -->
            <!-- ====================================== -->

            <div class="card shadow-sm mb-4">

                <div class="card-body">

                    <div class="row mb-3">

                        <div class="col-md-5">

                            <label class="form-label fw-bold">
                                Tipo de cota da tabela
                            </label>

                            <select
                                id="selectCotaTabela"
                                class="form-select"
                            >
                            </select>

                        </div>

                    </div>


                    <div class="table-responsive">

                        <table
                            class="table table-striped table-hover"
                        >

                            <thead class="table-dark">

                                <tr>

                                    <th>
                                        Ano
                                    </th>

                                    <th>
                                        Candidatos
                                    </th>

                                    <th>
                                        Vagas
                                    </th>

                                    <th>
                                        Candidatos/Vaga
                                    </th>

                                    <th>
                                        Nota mínima
                                    </th>

                                </tr>

                            </thead>


                            <tbody
                                id="corpoTabela"
                            >
                            </tbody>

                        </table>

                    </div>


                    <div class="text-center mt-3">

                        <button
                            id="btnAnalise"
                            class="btn btn-dark"
                        >
                            Análise
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ============================================== -->
<!-- PÁGINA COMPARAR -->
<!-- ============================================== -->

<div
    id="paginaComparacao"
    class="pagina"
>

    <!-- ESTADO INICIAL -->

    <div
        id="compararInicial"
        class="comparar-inicial"
    >

        <button
            id="btnAbrirComparacao"
            class="btn btn-primary btn-comparar-central shadow"
        >
            Comparar cursos
        </button>

    </div>


    <!-- ÁREA QUE APARECE APÓS CLICAR -->

    <div
        id="areaComparacao"
        class="container py-5 d-none"
    >


        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <h2 class="text-center mb-4">
                    Comparar cursos
                </h2>


                <div class="row g-3">


                    <!-- CURSO 1 -->

                    <div class="col-md-4">

                        <label class="form-label fw-bold">
                            Primeiro curso
                        </label>

                        <select
                            id="selectComparacao1"
                            class="form-select"
                        >
                            <option value="">
                                Selecione
                            </option>
                        </select>

                    </div>


                    <!-- CURSO 2 -->

                    <div class="col-md-4">

                        <label class="form-label fw-bold">
                            Segundo curso
                        </label>

                        <select
                            id="selectComparacao2"
                            class="form-select"
                        >
                            <option value="">
                                Selecione
                            </option>
                        </select>

                    </div>


                    <!-- COTA -->

                    <div class="col-md-4">

                        <label class="form-label fw-bold">
                            Tipo de cota
                        </label>

                        <select
                            id="selectCotaComparacao"
                            class="form-select"
                        >
                        </select>

                    </div>


                    <div class="col-12 text-center">

                        <button
                            id="btnGerarComparacao"
                            class="btn btn-success px-5"
                        >
                            Gerar comparação
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- GRÁFICO -->

        <div
            id="cardGraficoComparacao"
            class="card shadow-sm mb-5 d-none"
        >

            <div class="card-body">

                <h3
                    id="tituloComparacao"
                    class="text-center mb-4"
                ></h3>

                <canvas
                    id="graficoComparacao"
                ></canvas>

            </div>

        </div>


        <!-- ========================================== -->
        <!-- PERGUNTAS EM TEMA ESCURO -->
        <!-- ========================================== -->

        <div
            id="analiseComparacao"
            class="analise-escura d-none"
        >

            <h3 class="mb-4">
                Análise da comparação
            </h3>


            <div
                class="accordion"
                id="accordionPerguntas"
            >


                <!-- 01 -->

                <div class="accordion-item">

                    <h2 class="accordion-header">

                        <button
                            class="accordion-button"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#pergunta1"
                        >
                            Qual curso apresentou maior concorrência?
                        </button>

                    </h2>

                    <div
                        id="pergunta1"
                        class="accordion-collapse collapse show"
                    >

                        <div
                            id="resposta1"
                            class="accordion-body"
                        ></div>

                    </div>

                </div>


                <!-- 02 -->

                <div class="accordion-item">

                    <h2 class="accordion-header">

                        <button
                            class="accordion-button collapsed"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#pergunta2"
                        >
                            Qual curso apresentou menor concorrência?
                        </button>

                    </h2>

                    <div
                        id="pergunta2"
                        class="accordion-collapse collapse"
                    >

                        <div
                            id="resposta2"
                            class="accordion-body"
                        ></div>

                    </div>

                </div>


                <!-- 03 -->

                <div class="accordion-item">

                    <h2 class="accordion-header">

                        <button
                            class="accordion-button collapsed"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#pergunta3"
                        >
                            Qual curso apresentou maior crescimento?
                        </button>

                    </h2>

                    <div
                        id="pergunta3"
                        class="accordion-collapse collapse"
                    >

                        <div
                            id="resposta3"
                            class="accordion-body"
                        ></div>

                    </div>

                </div>


                <!-- 04 -->

                <div class="accordion-item">

                    <h2 class="accordion-header">

                        <button
                            class="accordion-button collapsed"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#pergunta4"
                        >
                            Houve queda de concorrência em algum curso?
                        </button>

                    </h2>

                    <div
                        id="pergunta4"
                        class="accordion-collapse collapse"
                    >

                        <div
                            id="resposta4"
                            class="accordion-body"
                        ></div>

                    </div>

                </div>


                <!-- 05 -->

                <div class="accordion-item">

                    <h2 class="accordion-header">

                        <button
                            class="accordion-button collapsed"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#pergunta5"
                        >
                            Qual curso foi mais estável?
                        </button>

                    </h2>

                    <div
                        id="pergunta5"
                        class="accordion-collapse collapse"
                    >

                        <div
                            id="resposta5"
                            class="accordion-body"
                        ></div>

                    </div>

                </div>


                <!-- 06 -->

                <div class="accordion-item">

                    <h2 class="accordion-header">

                        <button
                            class="accordion-button collapsed"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#pergunta6"
                        >
                            Qual ano teve maior concorrência média?
                        </button>

                    </h2>

                    <div
                        id="pergunta6"
                        class="accordion-collapse collapse"
                    >

                        <div
                            id="resposta6"
                            class="accordion-body"
                        ></div>

                    </div>

                </div>


                <!-- 07 -->

                <div class="accordion-item">

                    <h2 class="accordion-header">

                        <button
                            class="accordion-button collapsed"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#pergunta7"
                        >
                            Existe relação entre concorrência e nota mínima?
                        </button>

                    </h2>

                    <div
                        id="pergunta7"
                        class="accordion-collapse collapse"
                    >

                        <div
                            id="resposta7"
                            class="accordion-body"
                        ></div>

                    </div>

                </div>


                <!-- 08 -->

                <div class="accordion-item">

                    <h2 class="accordion-header">

                        <button
                            class="accordion-button collapsed"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#pergunta8"
                        >
                            Quais outras conclusões podem ser obtidas?
                        </button>

                    </h2>

                    <div
                        id="pergunta8"
                        class="accordion-collapse collapse"
                    >

                        <div
                            id="resposta8"
                            class="accordion-body"
                        ></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ============================================== -->
<!-- MODAL ANÁLISE DO CURSO -->
<!-- ============================================== -->

<div
    class="modal fade"
    id="modalAnalise"
    tabindex="-1"
>

    <div
        class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"
    >

        <div class="modal-content">

            <div class="modal-header bg-dark text-white">

                <h5
                    id="modalTitulo"
                    class="modal-title"
                >
                    Análise do curso
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div
                id="modalConteudo"
                class="modal-body"
            >
            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Fechar
                </button>

            </div>

        </div>

    </div>

</div>


<!-- ============================================== -->
<!-- SCRIPTS -->
<!-- ============================================== -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>


<script type="module">

import { db } from './database.js';


// =================================================
// ELEMENTOS
// =================================================

const paginaCursos =
    document.querySelector('#paginaCursos');

const paginaComparacao =
    document.querySelector('#paginaComparacao');

const btnPaginaCursos =
    document.querySelector('#btnPaginaCursos');

const btnPaginaComparar =
    document.querySelector('#btnPaginaComparar');

const btnTema =
    document.querySelector('#btnTema');

const selectCurso =
    document.querySelector('#selectCurso');

const conteudoCurso =
    document.querySelector('#conteudoCurso');

const tituloCurso =
    document.querySelector('#tituloCurso');

const selectCotaGrafico =
    document.querySelector('#selectCotaGrafico');

const selectCotaTabela =
    document.querySelector('#selectCotaTabela');

const corpoTabela =
    document.querySelector('#corpoTabela');

const btnAnalise =
    document.querySelector('#btnAnalise');

const btnAbrirComparacao =
    document.querySelector('#btnAbrirComparacao');

const compararInicial =
    document.querySelector('#compararInicial');

const areaComparacao =
    document.querySelector('#areaComparacao');

const selectComparacao1 =
    document.querySelector('#selectComparacao1');

const selectComparacao2 =
    document.querySelector('#selectComparacao2');

const selectCotaComparacao =
    document.querySelector('#selectCotaComparacao');

const btnGerarComparacao =
    document.querySelector('#btnGerarComparacao');

const cardGraficoComparacao =
    document.querySelector('#cardGraficoComparacao');

const analiseComparacao =
    document.querySelector('#analiseComparacao');


// =================================================
// NOMES DAS COTAS
// =================================================

const nomesCotas = {

    Universal: 'Universal',

    Negro: 'Negro',

    publica: 'Escola Pública',

    publicaNegro: 'Escola Pública + Negro',

    PCD: 'PCD'

};


// =================================================
// CORES
// =================================================

const corCurso1 = '#0d6efd';

const corCurso2 = '#dc3545';


// =================================================
// GRÁFICOS
// =================================================

let graficoCurso = null;

let graficoComparacao = null;


// =================================================
// FUNÇÃO PARA OBTER TODAS AS COTAS DE UM CURSO
// =================================================

function obterCotas(curso) {

    return [

        ...new Set(

            curso.cotas.flatMap(
                ano =>
                    ano.tipoCota.map(
                        cota => cota.tipo
                    )
            )

        )

    ];

}


// =================================================
// POPULAR SELECT DOS CURSOS
// =================================================

db.cursos.forEach(curso => {

    const option = `
        <option value="${curso.id}">
            ${curso.nome} (${curso.modalidade})
        </option>
    `;


    selectCurso.insertAdjacentHTML(
        'beforeend',
        option
    );


    selectComparacao1.insertAdjacentHTML(
        'beforeend',
        option
    );


    selectComparacao2.insertAdjacentHTML(
        'beforeend',
        option
    );

});


// =================================================
// POPULAR SELECT DE COTAS DA COMPARAÇÃO
// =================================================

Object.keys(nomesCotas).forEach(tipo => {

    selectCotaComparacao.insertAdjacentHTML(
        'beforeend',

        `
        <option value="${tipo}">
            ${nomesCotas[tipo]}
        </option>
        `
    );

});


// =================================================
// TROCAR PÁGINA
// =================================================

function abrirPagina(pagina) {

    paginaCursos.classList.remove('ativa');

    paginaComparacao.classList.remove('ativa');

    pagina.classList.add('ativa');

}


// =================================================
// BOTÃO CURSOS
// =================================================

btnPaginaCursos.addEventListener(
    'click',
    () => {

        abrirPagina(paginaCursos);

    }
);


// =================================================
// BOTÃO COMPARAR
// =================================================

btnPaginaComparar.addEventListener(
    'click',
    () => {

        abrirPagina(paginaComparacao);

    }
);


// =================================================
// ABRIR ÁREA DE COMPARAÇÃO
// =================================================

btnAbrirComparacao.addEventListener(
    'click',
    () => {

        compararInicial.classList.add('d-none');

        areaComparacao.classList.remove('d-none');

    }
);


// =================================================
// TROCAR TEMA
// =================================================

btnTema.addEventListener(
    'click',
    () => {

        document.body.classList.toggle(
            'dark-theme'
        );


        if (
            document.body.classList.contains(
                'dark-theme'
            )
        ) {

            btnTema.textContent =
                '☀️ Tema claro';

        } else {

            btnTema.textContent =
                '🌙 Tema escuro';

        }

    }
);


// =================================================
// SELECIONAR CURSO
// =================================================

selectCurso.addEventListener(
    'change',
    () => {

        const id =
            selectCurso.value;


        if (!id) {

            conteudoCurso.classList.add(
                'd-none'
            );

            return;

        }


        const curso =
            db.cursos.find(
                curso =>
                    String(curso.id) === id
            );


        if (!curso) return;


        conteudoCurso.classList.remove(
            'd-none'
        );


        tituloCurso.textContent =
            `${curso.nome} (${curso.modalidade})`;


        popularCotasDoCurso(curso);


        criarGraficoDoCurso(
            curso,
            selectCotaGrafico.value
        );


        criarTabelaDoCurso(
            curso,
            selectCotaTabela.value
        );

    }
);


// =================================================
// POPULAR COTAS DO CURSO
// =================================================

function popularCotasDoCurso(curso) {

    const cotas =
        obterCotas(curso);


    selectCotaGrafico.innerHTML = '';

    selectCotaTabela.innerHTML = '';


    cotas.forEach(tipo => {

        const option = `
            <option value="${tipo}">
                ${nomesCotas[tipo] || tipo}
            </option>
        `;


        selectCotaGrafico.insertAdjacentHTML(
            'beforeend',
            option
        );


        selectCotaTabela.insertAdjacentHTML(
            'beforeend',
            option
        );

    });

}


// =================================================
// MUDAR COTA DO GRÁFICO
// =================================================

selectCotaGrafico.addEventListener(
    'change',
    () => {

        const curso =
            db.cursos.find(
                c =>
                    String(c.id) ===
                    selectCurso.value
            );


        if (!curso) return;


        criarGraficoDoCurso(
            curso,
            selectCotaGrafico.value
        );

    }
);


// =================================================
// CRIAR GRÁFICO DO CURSO
// =================================================

function criarGraficoDoCurso(
    curso,
    tipoCota
) {

    if (graficoCurso) {

        graficoCurso.destroy();

    }


    const anos =
        curso.cotas
            .map(c => c.ano)
            .sort((a, b) => a - b);


    const dados =
        anos.map(ano => {

            const dadosAno =
                curso.cotas.find(
                    c => c.ano === ano
                );


            const cota =
                dadosAno.tipoCota.find(
                    c => c.tipo === tipoCota
                );


            if (
                !cota ||
                cota.vagas === 0
            ) {

                return null;

            }


            return Number(
                (
                    cota.candidatos /
                    cota.vagas
                ).toFixed(2)
            );

        });


    const contexto =
        document.querySelector(
            '#graficoCurso'
        );


    graficoCurso =
        new Chart(
            contexto,
            {

                type: 'line',

                data: {

                    labels: anos,

                    datasets: [

                        {

                            label:
                                nomesCotas[tipoCota]
                                || tipoCota,

                            data: dados,

                            borderColor: '#0d6efd',

                            backgroundColor: '#0d6efd',

                            borderWidth: 3,

                            tension: 0.2,

                            spanGaps: true

                        }

                    ]

                },

                options: {

                    responsive: true,

                    plugins: {

                        legend: {

                            position:
                                'bottom'

                        }

                    },

                    scales: {

                        y: {

                            beginAtZero: true,

                            title: {

                                display: true,

                                text:
                                    'Candidatos por vaga'

                            }

                        },

                        x: {

                            title: {

                                display: true,

                                text: 'Ano'

                            }

                        }

                    }

                }

            }

        );

}


// =================================================
// MUDAR COTA DA TABELA
// =================================================

selectCotaTabela.addEventListener(
    'change',
    () => {

        const curso =
            db.cursos.find(
                c =>
                    String(c.id) ===
                    selectCurso.value
            );


        if (!curso) return;


        criarTabelaDoCurso(
            curso,
            selectCotaTabela.value
        );

    }
);


// =================================================
// CRIAR TABELA
// =================================================

function criarTabelaDoCurso(
    curso,
    tipoCota
) {

    corpoTabela.innerHTML = '';


    curso.cotas
        .slice()
        .sort(
            (a, b) =>
                b.ano - a.ano
        )
        .forEach(dadosAno => {

            const cota =
                dadosAno.tipoCota.find(
                    item =>
                        item.tipo === tipoCota
                );


            const candidatos =
                cota
                    ? cota.candidatos
                    : '-';


            const vagas =
                cota
                    ? cota.vagas
                    : '-';


            const concorrencia =
                cota && cota.vagas > 0

                    ? (
                        cota.candidatos /
                        cota.vagas
                    ).toFixed(2)

                    : '-';


            const nota =
                cota &&
                cota.notaMinima !== 0

                    ? cota.notaMinima

                    : '-';


            corpoTabela.insertAdjacentHTML(

                'beforeend',

                `

                <tr>

                    <th>
                        ${dadosAno.ano}
                    </th>

                    <td>
                        ${candidatos}
                    </td>

                    <td>
                        ${vagas}
                    </td>

                    <td>
                        ${concorrencia}
                    </td>

                    <td>
                        ${nota}
                    </td>

                </tr>

                `

            );

        });

}

// =================================================
// PEGAR CONCORRÊNCIA
// =================================================

function obterConcorrencia(
    curso,
    ano,
    tipoCota
) {

    const dadosAno =
        curso.cotas.find(
            c => c.ano === ano
        );


    if (!dadosAno) return null;


    const cota =
        dadosAno.tipoCota.find(
            c => c.tipo === tipoCota
        );


    if (
        !cota ||
        cota.vagas === 0
    ) {

        return null;

    }


    return Number(
        (
            cota.candidatos /
            cota.vagas
        ).toFixed(2)
    );

}


// =================================================
// GRÁFICO DA COMPARAÇÃO
// =================================================

function criarGraficoComparacao(
    curso1,
    curso2,
    tipoCota
) {

    if (graficoComparacao) {

        graficoComparacao.destroy();

    }


    const anos = [

        ...new Set([

            ...curso1.cotas.map(
                c => c.ano
            ),

            ...curso2.cotas.map(
                c => c.ano
            )

        ])

    ].sort(
        (a, b) => a - b
    );


    const dadosCurso1 =
        anos.map(
            ano =>
                obterConcorrencia(
                    curso1,
                    ano,
                    tipoCota
                )
        );


    const dadosCurso2 =
        anos.map(
            ano =>
                obterConcorrencia(
                    curso2,
                    ano,
                    tipoCota
                )
        );


    document.querySelector(
        '#tituloComparacao'
    ).textContent =
        `${curso1.nome} × ${curso2.nome} — ${nomesCotas[tipoCota]}`;


    graficoComparacao =
        new Chart(
            document.querySelector(
                '#graficoComparacao'
            ),
            {

                type: 'line',

                data: {

                    labels: anos,

                    datasets: [

                        {

                            label:
                                curso1.nome,

                            data:
                                dadosCurso1,

                            borderColor:
                                corCurso1,

                            backgroundColor:
                                corCurso1,

                            borderWidth: 3,

                            tension: 0.2,

                            spanGaps: true

                        },


                        {

                            label:
                                curso2.nome,

                            data:
                                dadosCurso2,

                            borderColor:
                                corCurso2,

                            backgroundColor:
                                corCurso2,

                            borderWidth: 3,

                            tension: 0.2,

                            spanGaps: true

                        }

                    ]

                },

                options: {

                    responsive: true,

                    plugins: {

                        legend: {

                            position:
                                'bottom'

                        },

                        tooltip: {

                            callbacks: {

                                label:
                                    context =>
                                        `${context.dataset.label}: ${context.raw} cand/vaga`

                            }

                        }

                    },

                    scales: {

                        y: {

                            beginAtZero: true,

                            title: {

                                display: true,

                                text:
                                    'Candidatos por vaga'

                            }

                        },

                        x: {

                            title: {

                                display: true,

                                text: 'Ano'

                            }

                        }

                    }

                }

            }

        );

}


// =================================================
// MÉDIA DA CONCORRÊNCIA DE UMA COTA
// =================================================

function calcularMedia(
    curso,
    tipoCota
) {

    const valores =
        curso.cotas
            .map(
                dadosAno =>
                    obterConcorrencia(
                        curso,
                        dadosAno.ano,
                        tipoCota
                    )
            )
            .filter(
                valor =>
                    valor !== null
            );


    if (valores.length === 0) {

        return 0;

    }


    return valores.reduce(
        (total, valor) =>
            total + valor,
        0
    ) / valores.length;

}


// =================================================
// CRESCIMENTO
// =================================================

function calcularCrescimento(
    curso,
    tipoCota
) {

    const valores =
        curso.cotas
            .map(dadosAno => ({

                ano:
                    dadosAno.ano,

                valor:
                    obterConcorrencia(
                        curso,
                        dadosAno.ano,
                        tipoCota
                    )

            }))

            .filter(
                item =>
                    item.valor !== null
            )

            .sort(
                (a, b) =>
                    a.ano - b.ano
            );


    if (valores.length < 2) {

        return 0;

    }


    const primeiro =
        valores[0].valor;

    const ultimo =
        valores[
            valores.length - 1
        ].valor;


    if (primeiro === 0) {

        return 0;

    }


    return (
        (
            ultimo - primeiro
        )
        /
        primeiro
    ) * 100;

}


// =================================================
// PREENCHER ANÁLISE
// =================================================

function preencherAnalise(
    curso1,
    curso2,
    tipoCota
) {

    const media1 =
        calcularMedia(
            curso1,
            tipoCota
        );

    const media2 =
        calcularMedia(
            curso2,
            tipoCota
        );


    const crescimento1 =
        calcularCrescimento(
            curso1,
            tipoCota
        );

    const crescimento2 =
        calcularCrescimento(
            curso2,
            tipoCota
        );


    // 1

    document.querySelector(
        '#resposta1'
    ).innerHTML = `

        Considerando a cota
        <strong>
            ${nomesCotas[tipoCota]}
        </strong>,
        o curso com maior concorrência média foi

        <strong>
            ${
                media1 > media2
                    ? curso1.nome
                    : curso2.nome
            }
        </strong>.

        <br><br>

        ${curso1.nome}:
        <strong>
            ${media1.toFixed(2)}
        </strong>
        candidatos/vaga.

        <br>

        ${curso2.nome}:
        <strong>
            ${media2.toFixed(2)}
        </strong>
        candidatos/vaga.

    `;


    // 2

    document.querySelector(
        '#resposta2'
    ).innerHTML = `

        O curso com menor concorrência média nessa
        comparação foi

        <strong>
            ${
                media1 < media2
                    ? curso1.nome
                    : curso2.nome
            }
        </strong>.

    `;


    // 3

    document.querySelector(
        '#resposta3'
    ).innerHTML = `

        ${curso1.nome} apresentou uma variação de

        <strong>
            ${crescimento1.toFixed(2)}%
        </strong>.

        <br>

        ${curso2.nome} apresentou uma variação de

        <strong>
            ${crescimento2.toFixed(2)}%
        </strong>.

        <br><br>

        O maior crescimento foi de

        <strong>
            ${
                crescimento1 > crescimento2
                    ? curso1.nome
                    : curso2.nome
            }
        </strong>.

    `;


    // 4

    document.querySelector(
        '#resposta4'
    ).innerHTML = `

        ${
            crescimento1 < 0

                ? `<strong>${curso1.nome}</strong> apresentou queda de concorrência.`

                : `${curso1.nome} não apresentou queda considerando o primeiro e o último dado disponível.`
        }

        <br><br>

        ${
            crescimento2 < 0

                ? `<strong>${curso2.nome}</strong> apresentou queda de concorrência.`

                : `${curso2.nome} não apresentou queda considerando o primeiro e o último dado disponível.`
        }

    `;


    // 5

    const estabilidade1 =
        Math.abs(
            crescimento1
        );

    const estabilidade2 =
        Math.abs(
            crescimento2
        );


    document.querySelector(
        '#resposta5'
    ).innerHTML = `

        Considerando a diferença percentual entre o
        primeiro e o último ano disponível, o curso mais
        estável foi

        <strong>
            ${
                estabilidade1 < estabilidade2
                    ? curso1.nome
                    : curso2.nome
            }
        </strong>.

    `;


    // 6

    const anos = [

        ...new Set([

            ...curso1.cotas.map(
                c => c.ano
            ),

            ...curso2.cotas.map(
                c => c.ano
            )

        ])

    ].sort(
        (a, b) => a - b
    );


    let maiorAno = null;

    let maiorMedia = -Infinity;


    anos.forEach(ano => {

        const valor1 =
            obterConcorrencia(
                curso1,
                ano,
                tipoCota
            );

        const valor2 =
            obterConcorrencia(
                curso2,
                ano,
                tipoCota
            );


        const valores =
            [
                valor1,
                valor2
            ].filter(
                valor =>
                    valor !== null
            );


        if (!valores.length) return;


        const media =
            valores.reduce(
                (total, valor) =>
                    total + valor,
                0
            ) / valores.length;


        if (media > maiorMedia) {

            maiorMedia = media;

            maiorAno = ano;

        }

    });


    document.querySelector(
        '#resposta6'
    ).innerHTML = `

        O ano com maior concorrência média entre os
        dois cursos, considerando a cota selecionada,
        foi

        <strong>
            ${maiorAno}
        </strong>.

        <br><br>

        Média:
        <strong>
            ${maiorMedia.toFixed(2)}
        </strong>
        candidatos/vaga.

    `;


    // 7

    document.querySelector(
        '#resposta7'
    ).innerHTML = `

        Para analisar a relação entre concorrência e nota
        mínima é necessário observar os dados de nota de
        cada ano e verificar se períodos de maior
        concorrência também apresentam notas mínimas mais
        elevadas.

        A análise deve ser feita respeitando a
        <strong>
            cota selecionada
        </strong>.

    `;


    // 8

    document.querySelector(
        '#resposta8'
    ).innerHTML = `

        A comparação da cota
        <strong>
            ${nomesCotas[tipoCota]}
        </strong>
        permite identificar diferenças entre os cursos,
        períodos de crescimento ou queda e qual curso
        possui maior concorrência média.

        <br><br>

        Média de ${curso1.nome}:
        <strong>
            ${media1.toFixed(2)}
        </strong>
        candidatos/vaga.

        <br>

        Média de ${curso2.nome}:
        <strong>
            ${media2.toFixed(2)}
        </strong>
        candidatos/vaga.

    `;

}
